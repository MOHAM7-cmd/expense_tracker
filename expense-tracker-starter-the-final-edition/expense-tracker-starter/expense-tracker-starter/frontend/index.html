<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>


<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <span class="navbar-brand mb-0 h1">Expense Tracker</span>
  </div>
</nav>

<div class="container my-4">

<div id="alertBox" class="alert d-none" role="alert"></div>

<div id="loadingSpinner" class="text-center my-4 d-none">

  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>

  <p class="mt-2">Loading expenses...</p>

</div> 


  <!-- the cards (symmery) -->
  <div class="row g-3 mb-4">

    <div class="col-md-4">
      <div class="card text-center">
        <div class="card-body">
          <h5>Total Expenses</h5>
          <h3 id="totalAmount">0 JD</h3>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card text-center">
        <div class="card-body">
          <h5>Number of Expenses</h5>
          <h3 id="expensesCount">0</h3>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card text-center">
        <div class="card-body">
          <h5>Highest Expense</h5>
          <h3 id="highestExpense">0 JD</h3>
        </div>
      </div>
    </div>

  </div>


  <!-- Add Expense Form -->
  <div class="card mb-4">
    <div class="card-body">

      <h4 class="mb-3">Add Expense</h4>

      <form id="expenseForm">

        <div class="row g-3">

          <div class="col-md-3">
            <label for="title" class="form-label">Title</label>
            <input
              type="text"
              class="form-control"
              id="title"
              required
            >
          </div>

          <div class="col-md-3">
            <label for="amount" class="form-label">Amount</label>
            <input
              type="number"
              class="form-control"
              id="amount"
              step="0.01"
              min="0.01"
              required
            >
          </div>

          <div class="col-md-3">
            <label for="category" class="form-label">Category</label>

            <select class="form-select" id="category" required>
              <option value="">Choose category</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="col-md-3">
            <label for="date" class="form-label">Date</label>
            <input
              type="date"
              class="form-control"
              id="date"
              required
            >
          </div>

        </div>

        <button type="submit" class="btn btn-primary mt-3">
          Add Expense
        </button>

      </form>

    </div>
  </div>


  <!-- Filter -->
  <div class="mb-3">

    <label for="categoryFilter" class="form-label">
      Filter by Category
    </label>

    <select id="categoryFilter" class="form-select">

      <option value="All">All</option>
      <option value="Food">Food</option>
      <option value="Transport">Transport</option>
      <option value="Bills">Bills</option>
      <option value="Entertainment">Entertainment</option>
      <option value="Other">Other</option>

    </select>

  </div>


  <!-- Expenses Table -->
  <div class="table-responsive">

    <table class="table table-striped table-bordered">

      <thead class="table-dark">
        <tr>
          <th>Title</th>
          <th>Amount</th>
          <th>Category</th>
          <th>Date</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="expensesTableBody">

        <!-- JavaScript will add rows here -->

      </tbody>

    </table>

  </div>

</div>



  <!-- Edit Expense Modal -->
<div class="modal fade" id="editModal" tabindex="-1">

  <div class="modal-dialog">

    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Edit Expense</h5>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal">
        </button>
      </div>

      <div class="modal-body">

        <form id="editForm">

          <input type="hidden" id="editId">

          <div class="mb-3">
            <label for="editTitle" class="form-label">Title</label>
            <input
              type="text"
              class="form-control"
              id="editTitle"
              required
            >
          </div>

          <div class="mb-3">
            <label for="editAmount" class="form-label">Amount</label>
            <input
              type="number"
              class="form-control"
              id="editAmount"
              min="0.01"
              step="0.01"
              required
            >
          </div>

          <div class="mb-3">
            <label for="editCategory" class="form-label">Category</label>

            <select
              class="form-select"
              id="editCategory"
              required>

              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>

            </select>
          </div>

          <div class="mb-3">
            <label for="editDate" class="form-label">Date</label>

            <input
              type="date"
              class="form-control"
              id="editDate"
              required
            >
          </div>

        </form>

      </div>

      <div class="modal-footer">

        <button
          type="button"
          class="btn btn-secondary"
          data-bs-dismiss="modal">
          Cancel
        </button>

        <button
          type="submit"
          form="editForm"
          class="btn btn-primary">
          Save Changes
        </button>

      </div>

    </div>

  </div>

</div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
